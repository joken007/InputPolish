<!doctype html>
<html><head><meta charset="utf-8"><title>InputPolish Test</title>
<style>body{margin:0;font:16px "Microsoft YaHei"} textarea{width:96vw;height:70vh;margin:2vh 2vw;font:16px "Microsoft YaHei"}</style>
</head><body>
<textarea id="d">这个方案有点问题主要是成本太高而且交付周期长</textarea>
<script>
var d = document.getElementById('d');
function sync(){ document.title = 'TA:' + d.value; }
d.addEventListener('input', sync);
d.focus();
d.setSelectionRange(d.value.length, d.value.length);
sync();
</script>
</body></html>
