<h1>为什么需要在输入框里润色</h1>
<p>大多数人写草稿的时候,注意力在"想清楚"上,而不是"写清楚"。</p>
<p>于是发出去的消息经常缺主语、缺因果、缺结论,对方要多问两轮才能明白你的意思。</p>
<p>InputPolish 的做法是在你按下三个空格之后,用模型把草稿重排一遍:先给结论,再列理由,最后给建议的动作。</p>
<p>它不会替你编造事实,也不会删除你提到的约束条件,只是把顺序和措辞调整到更容易被读懂的样子。</p>
<p>改完之后如果觉得不合适,按一次撤销热键就能回到原文,原文一直保留在内存里,直到你关掉程序。</p>
<p>对于经常写周报、发工单、回邮件的人来说,这个改动省下的解释成本比输入本身更高。</p>
</body>
